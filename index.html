  const btn = $("toggleEdit");
  btn.classList.toggle("active", isEditing);
  btn.innerHTML = isEditing ? "✅ 完成編輯" : "✏️ 編輯模式";
}

function notesHTML(n) {
  const L = n.split("\n").filter(x => x.trim());
  if (!L.length) return "";
  let inner = "";
  if (L.some(x => /^\d+\.\s/.test(x))) {
    const head = L.filter(x => !/^\d+\.\s/.test(x)).map(x => `<div>${esc(x)}</div>`).join("");
    inner = head + "<ol>" + L.filter(x => /^\d+\.\s/.test(x)).map(x => `<li>${esc(x.replace(/^\d+\.\s*/, ""))}</li>`).join("") + "</ol>";
  } else {
    inner = "<ul>" + L.map(x => `<li>${esc(x)}</li>`).join("") + "</ul>";
  }
  return `<div class="notes-box">${inner}</div>`;
}

function render() {
  $("tabs").innerHTML =
    `<button class="tab ${cur === "sum" ? "on" : ""}" data-t="sum"><b>📋</b>總覽</button>` +
    S.days.map((d, i) => `<button class="tab ${cur === d.id ? "on" : ""}" data-t="${d.id}"><b>${esc(d.emoji)} D${i + 1}</b>${esc(d.date.split("（")[0])}</button>`).join("") +
    `<button class="tab edit-only" data-t="+" style="border-style:dashed;color:var(--red)"><b>＋</b>加一天</button>`;

  const m = $("main");
  if (cur === "sum") {
    const totalItems = S.days.reduce((acc, d) => acc + d.items.length, 0);
    const doneItems = S.days.reduce((acc, d) => acc + d.items.filter(it => S.done[it.id]).length, 0);
    const pct = totalItems ? Math.round((doneItems / totalItems) * 100) : 0;

    m.innerHTML = `
      <div class="progress-wrap">
        <div class="progress-top">
          <span>旅程打卡進度</span>
          <span>${doneItems} / ${totalItems} 項 (${pct}%)</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="sum-card" style="cursor:default">
        <div class="ic">🏠</div>
        <div style="flex:1">
          <span class="sum-badge">全程住宿</span>
          <div class="sum-title">大阪民泊【山也居】</div>
          <div style="font-size:13px;color:var(--sub);margin-top:2px">大阪市西成區天下茶屋東 2-14-30</div>
          <div class="maps" style="margin-top:8px">
            <a class="map" target="_blank" rel="noopener" href="${esc(url(INN.q))}">📍 開啟民宿 Google 地圖</a>
          </div>
        </div>
      </div>
      ` +
      S.days.map((d, i) => `
        <div class="sum-card" data-go="${d.id}">
          <div class="ic">${esc(d.emoji)}</div>
          <div>
            <span class="sum-badge">DAY ${i + 1}・${esc(d.date)}</span>
            <div class="sum-title">${esc(d.title)}</div>
          </div>
          <div class="sum-arrow">›</div>
        </div>
      `).join("") +
      `
      <div class="foot edit-only">
        <button class="btn" id="exp">⬇️ 備份行程</button>
        <button class="btn" id="imp">⬆️ 還原備份</button>
        <button class="btn warn" id="rst">↩️ 恢復原始行程</button>
      </div>
      <p class="edit-only" style="justify-content:center;color:var(--sub);font-size:13px;margin-top:8px">目前為編輯模式，所有修改自動儲存在本機瀏覽器</p>
    `;
    return;
  }

  const di = S.days.findIndex(d => d.id === cur);
  if (di < 0) { cur = "sum"; return render(); }
  const d = S.days[di];

  m.innerHTML = `
    <div class="dayhead">
      <div>
        <small>DAY ${di + 1} ｜ ${esc(d.date)}</small>
        <h2>${esc(d.emoji)} ${esc(d.title)}</h2>
      </div>
      <button class="btn edit-only" id="ed">✏️ 修改標題</button>
    </div>
    <div class="timeline">
      ${d.items.map((it, i) => `
        <div class="card ${S.done[it.id] ? "done" : ""}" data-i="${i}">
          <div class="top">
            <div class="ic">${esc(it.icon)}</div>
            <div style="flex:1;min-width:0">
              ${it.time ? `<span class="time">${esc(it.time)}</span>` : ""}
              <h3>${esc(it.title)}</h3>
            </div>
            <button class="check-btn" data-a="done" title="標記完成">${S.done[it.id] ? "✓" : ""}</button>
          </div>
          ${notesHTML(it.notes)}
          ${it.maps.length ? `<div class="maps">${it.maps.map(x => `<a class="map" target="_blank" rel="noopener" href="${esc(url(x.q))}">📍 ${esc(x.label || it.title)}</a>`).join("")}</div>` : ""}
          <div class="tools edit-only">
            <button class="btn" data-a="up" title="上移">⬆️</button>
            <button class="btn" data-a="dn" title="下移">⬇️</button>
            <button class="btn" data-a="edit">✏️ 編輯</button>
            <button class="btn warn" data-a="del" style="margin-left:auto">🗑️ 刪除</button>
          </div>
        </div>
      `).join("")}
    </div>
    <button class="add edit-only" id="addi">＋ 新增這天的行程</button>
  `;
}

function itemForm(it, cb) {
  const mp = it.maps.map(x => (x.label ? x.label + "|" : "") + x.q).join("\n");
  $("dlgbody").innerHTML = `
    <h2 style="margin:0">${it.title ? "編輯行程" : "新增行程"}</h2>
    <div class="row">
      <div><label>圖示</label><input id="f_i" value="${esc(it.icon || "📌")}"></div>
      <div><label>時間</label><input id="f_t" value="${esc(it.time)}" placeholder="例：11:30"></div>
    </div>
    <label>標題</label><input id="f_n" value="${esc(it.title)}">
    <label>備註內容 <span class="hint">一行一項</span></label><textarea id="f_o">${esc(it.notes)}</textarea>
    <label>Google 地圖 <span class="hint">一行一個：按鈕名稱|搜尋關鍵字</span></label><textarea id="f_m">${esc(mp)}</textarea>
    <div class="acts">
      <button class="btn" id="cx">取消</button>
      <button class="btn primary" id="ok">儲存</button>
    </div>
  `;
  $("dlg").showModal();
  $("cx").onclick = () => $("dlg").close();
  $("ok").onclick = () => {
    cb({
      icon: $("f_i").value || "📌",
      time: $("f_t").value.trim(),
      title: $("f_n").value.trim() || "（未命名）",
      notes: $("f_o").value,
      maps: $("f_m").value.split("\n").map(s => s.trim()).filter(Boolean).map(s => {
        const p = s.split("|");
        return p.length > 1 ? { label: p[0].trim(), q: p.slice(1).join("|").trim() } : { label: "", q: s };
      })
    });
    save();
    $("dlg").close();
    render();
  };
}

function dayForm(d, isNew) {
  $("dlgbody").innerHTML = `
    <h2 style="margin:0">${isNew ? "新增一天" : "編輯這一天"}</h2>
    <div class="row">
      <div><label>圖示</label><input id="g_e" value="${esc(d.emoji)}"></div>
      <div><label>日期</label><input id="g_d" value="${esc(d.date)}" placeholder="例：12/7（一）"></div>
    </div>
    <label>當日主題標題</label><input id="g_t" value="${esc(d.title)}">
    <div class="acts">
      ${isNew ? "" : `<button class="btn warn" id="gdel" style="margin-right:auto">刪除這天</button>`}
      <button class="btn" id="cx">取消</button>
      <button class="btn primary" id="ok">儲存</button>
    </div>
  `;
  $("dlg").showModal();
  $("cx").onclick = () => $("dlg").close();
  if (!isNew) {
    $("gdel").onclick = () => {
      if (confirm("確定刪除整天行程？")) {
        S.days = S.days.filter(x => x !== d);
        cur = "sum";
        save();
        $("dlg").close();
        render();
      }
    };
  }
  $("ok").onclick = () => {
    d.emoji = $("g_e").value || "📅";
    d.date = $("g_d").value;
    d.title = $("g_t").value || "新的一天";
    if (isNew) { S.days.push(d); cur = d.id; }
    save();
    $("dlg").close();
    render();
  };
}

$("toggleEdit").onclick = toggleEditMode;

document.addEventListener("click", e => {
  const t = e.target.closest("[data-t]");
  if (t) {
    if (t.dataset.t === "+") dayForm({ id: uid(), date: "", title: "", emoji: "📅", items: [] }, true);
    else { cur = t.dataset.t; render(); scrollTo(0, 0); }
    return;
  }
  const g = e.target.closest("[data-go]");
  if (g) { cur = g.dataset.go; render(); scrollTo(0, 0); return; }

  const d = S.days.find(x => x.id === cur);
  if (e.target.id === "ed") return dayForm(d, false);
  if (e.target.id === "addi") return itemForm({ icon: "📌", time: "", title: "", notes: "", maps: [] }, v => d.items.push({ id: uid(), ...v }));

  const a = e.target.closest("[data-a]");
  if (a && d) {
    const i = +a.closest(".card").dataset.i, it = d.items[i], k = a.dataset.a;
    if (k === "done") { S.done[it.id] = !S.done[it.id]; save(); render(); }
    else if (k === "edit") itemForm(it, v => Object.assign(it, v));
    else if (k === "del") { if (confirm("確定刪除「" + it.title + "」？")) { d.items.splice(i, 1); save(); render(); } }
    else {
      const j = k === "up" ? i - 1 : i + 1;
      if (j >= 0 && j < d.items.length) { [d.items[i], d.items[j]] = [d.items[j], d.items[i]]; save(); render(); }
    }
  }

  if (e.target.id === "rst" && confirm("所有修改都會消失，確定恢復？")) {
    S = { days: JSON.parse(JSON.stringify(DEF)), done: {} };
    save();
    render();
  }
  if (e.target.id === "exp") {
    $("dlgbody").innerHTML = `<h2 style="margin:0">備份行程</h2><p style="font-size:15px;color:var(--sub)">複製下方文字傳給家人，或貼到記事本保存。</p><textarea id="bx" style="min-height:180px" readonly>${esc(JSON.stringify(S))}</textarea><div class="acts"><button class="btn primary" id="cx">關閉</button></div>`;
    $("dlg").showModal();
    $("cx").onclick = () => $("dlg").close();
  }
  if (e.target.id === "imp") {
    $("dlgbody").innerHTML = `<h2 style="margin:0">還原備份</h2><p style="font-size:15px;color:var(--sub)">貼上之前複製的備份文字。</p><textarea id="bx" style="min-height:180px"></textarea><div class="acts"><button class="btn" id="cx">取消</button><button class="btn primary" id="ok">還原</button></div>`;
    $("dlg").showModal();
    $("cx").onclick = () => $("dlg").close();
    $("ok").onclick = () => {
      try {
        const n = JSON.parse($("bx").value);
        if (!n.days) throw 0;
        S = n;
        save();
        $("dlg").close();
        render();
      } catch (_) { alert("格式不正確，請確認是否完整複製"); }
    };
  }
});

$("toggleEdit").innerHTML = "✏️ 編輯模式";
render();
</script>
</body>
</html>
