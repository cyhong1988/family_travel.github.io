/* Apple 風格隨顯滾動觀察器 */
let io;
function initReveal() {
  if (io) io.disconnect();
  const els = document.querySelectorAll(".reveal");
  io = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add("in");
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.08, rootMargin: "0px 0px -24px 0px" });

  els.forEach((el, idx) => {
    el.style.transitionDelay = `${Math.min(idx * 50, 260)}ms`;
    io.observe(el);
  });
}

/* Hero 滾動微視差 */
window.addEventListener("scroll", () => {
  const hero = $("hero");
  if (!hero) return;
  const y = window.scrollY;
  if (y < 320) {
    const progress = y / 320;
    hero.style.transform = `translateY(${y * 0.22}px) scale(${1 - progress * 0.04})`;
    hero.style.opacity = `${1 - progress * 0.65}`;
  }
}, { passive: true });

function toggleEditMode() {
  isEditing = !isEditing;
  document.body.classList.toggle("is-editing", isEditing);
  const btn = $("toggleEdit");
  btn.classList.toggle("active", isEditing);
  btn.innerHTML = isEditing ? "完成編輯" : "編輯模式";
}

function notesHTML(n) {
  const L = n.split("\n").filter(x => x.trim());
  if (!L.length) return "";
  let inner = "";
  if (L.some(x => /^\d+\.\s/.test(x))) {
    const head = L.filter(x => !/^\d+\.\s/.test(x)).map(x => `<div>${esc(x)}</div>`).join("");
    inner = head + "<ol>" + L.filter(x => /^\d+\.\s/.test(x)).map(x => `<li>${esc(x.replace(/^\d+\.\s*/, ""))}</li>`).join("") + "</ol>";
  } else {
    inner = "<ul>" + L.map(x => `<li>${esc(x)}</li>`).join("") + "</ul>";
  }
  return `<div class="notes-box">${inner}</div>`;
}

              <div class="day-meta">DAY ${i + 1} ・ ${esc(d.date)}</div>
              <div class="day-name">${esc(d.title)}</div>
              ${d.cafes && d.cafes.length ? `<div class="day-coffee-pill">☕ 含 ${d.cafes.length} 間順路高分咖啡推薦</div>` : ""}
            </div>
            <div class="day-chevron">›</div>
          </div>
        `).join("")}
      </div>

      <div class="foot edit-only">
        <button class="btn" id="exp">備份行程 JSON</button>
        <button class="btn" id="imp">還原備份</button>
        <button class="btn warn" id="rst">重置為預設行程</button>
      </div>
      <p class="edit-only" style="justify-content:center;color:var(--tertiary);font-size:12px;margin-top:10px">編輯模式已開啟・所有變更自動儲存於本機瀏覽器</p>
    `;
    initReveal();
    return;
  }

  const di = S.days.findIndex(d => d.id === cur);
  if (di < 0) { cur = "sum"; return render(); }
  const d = S.days[di];
  const hasCafes = d.cafes && d.cafes.length > 0;

  m.innerHTML = `
    <div class="dayhead reveal">
      <div>
        <div class="dayhead-tag">DAY ${di + 1} ・ ${esc(d.date)}</div>
        <h2>${esc(d.emoji)} ${esc(d.title)}</h2>
      </div>
      <button class="btn edit-only" id="ed">修改標題</button>
    </div>

    <div class="cards-stack">
      ${d.items.map((it, i) => `
        <article class="card reveal ${S.done[it.id] ? "done" : ""}" data-i="${i}">
          <div class="card-top">
            <div class="card-ic">${esc(it.icon)}</div>
            <div style="flex:1;min-width:0">
              ${it.time ? `<span class="card-time">${esc(it.time)}</span>` : ""}
              <h3>${esc(it.title)}</h3>
            </div>
            <button class="check-btn" data-a="done" title="標記完成">✓</button>
          </div>
          ${notesHTML(it.notes)}
          ${it.maps.length ? `<div class="maps">${it.maps.map(x => `<a class="map" target="_blank" rel="noopener" href="${esc(url(x.q))}">📍 ${esc(x.label || it.title)}</a>`).join("")}</div>` : ""}
          <div class="tools edit-only">
            <button class="btn" data-a="up" title="上移">↑ 上移</button>
            <button class="btn" data-a="dn" title="下移">↓ 下移</button>
            <button class="btn" data-a="edit">編輯</button>
            <button class="btn warn" data-a="del" style="margin-left:auto">刪除</button>
          </div>
        </article>
      `).join("")}
    </div>

    <button class="add edit-only" id="addi">＋ 新增這天的行程</button>

    ${(hasCafes || isEditing) ? `
      <section class="coffee-section reveal">
        <div class="coffee-head">
          <div>
            <span class="coffee-kicker">CURATED COFFEE STOPS</span>
            <h3>☕ 每日順路高評價咖啡廳</h3>
          </div>
          <button class="btn edit-only" id="addc" style="color:var(--coffee);border-color:var(--coffee-border)">＋ 新增咖啡廳</button>
        </div>
        ${hasCafes ? `
          <div class="coffee-list">
            ${d.cafes.map((c, ci) => `
              <div class="coffee-item" data-ci="${ci}">
                <div class="coffee-item-top">
                  <div class="coffee-name">${esc(c.name)}</div>
                  ${c.rating ? `<span class="coffee-rating">${esc(c.rating)}</span>` : ""}
                </div>
                ${c.spot ? `<div class="coffee-meta">🧭 ${esc(c.spot)}</div>` : ""}
                ${c.desc ? `<div class="coffee-desc">${esc(c.desc)}</div>` : ""}
                <div class="coffee-actions">
                  ${c.q ? `<a class="coffee-map" target="_blank" rel="noopener" href="${esc(url(c.q))}">📍 開啟地圖導航</a>` : ""}
                  <button class="btn edit-only" data-ca="edit" style="margin-left:auto">編輯</button>
                  <button class="btn warn edit-only" data-ca="del">刪除</button>
                </div>
              </div>
            `).join("")}
          </div>
        ` : `<p style="font-size:14px;color:var(--sub);margin:0">這天目前沒有設定咖啡廳，點擊右上角可新增推薦店家。</p>`}
      </section>
    ` : ""}
  `;
  initReveal();
}

function itemForm(it, cb) {
  const mp = it.maps.map(x => (x.label ? x.label + "|" : "") + x.q).join("\n");
  $("dlgbody").innerHTML = `
    <h2 style="margin:0;font-size:22px;letter-spacing:-0.02em">${it.title ? "編輯行程" : "新增行程"}</h2>
    <div class="row">
      <div><label>圖示</label><input id="f_i" value="${esc(it.icon || "📌")}"></div>
      <div><label>時間</label><input id="f_t" value="${esc(it.time)}" placeholder="例：11:30"></div>
    </div>
    <label>標題</label><input id="f_n" value="${esc(it.title)}">
    <label>備註內容 <span class="hint">一行一項</span></label><textarea id="f_o">${esc(it.notes)}</textarea>
    <label>地圖導航 <span class="hint">一行一個：按鈕名稱|搜尋關鍵字</span></label><textarea id="f_m">${esc(mp)}</textarea>
    <div class="acts">
      <button class="btn" id="cx">取消</button>
      <button class="btn primary" id="ok">儲存</button>
    </div>
  `;
  $("dlg").showModal();
  $("cx").onclick = () => $("dlg").close();
  $("ok").onclick = () => {
    cb({
      icon: $("f_i").value || "📌",
      time: $("f_t").value.trim(),
      title: $("f_n").value.trim() || "（未命名）",
      notes: $("f_o").value,
      maps: $("f_m").value.split("\n").map(s => s.trim()).filter(Boolean).map(s => {
        const p = s.split("|");
        return p.length > 1 ? { label: p[0].trim(), q: p.slice(1).join("|").trim() } : { label: "", q: s };
      })
    });
    save();
    $("dlg").close();
    render();
  };
}

function cafeForm(c, cb) {
  $("dlgbody").innerHTML = `
    <h2 style="margin:0;font-size:22px;letter-spacing:-0.02em">${c.name ? "編輯順路咖啡廳" : "新增順路咖啡廳"}</h2>
    <div class="row">
      <div><label>Google 評分</label><input id="c_r" value="${esc(c.rating || "4.8 ★")}" placeholder="例：4.8 ★"></div>
      <div><label>咖啡廳名稱</label><input id="c_n" value="${esc(c.name)}" placeholder="例：Notequal Coffee"></div>
    </div>
    <label>順路位置 / 營業時間提示</label><input id="c_s" value="${esc(c.spot)}" placeholder="例：本町站步行 3 分鐘・08:00 營業">
    <label>推薦理由</label><textarea id="c_d" placeholder="例：手沖單品水準極高，適合早餐歇腳">${esc(c.desc)}</textarea>
    <label>Google 地圖搜尋關鍵字</label><input id="c_q" value="${esc(c.q)}" placeholder="店名＋大阪或京都">
    <div class="acts">
      <button class="btn" id="cx">取消</button>
      <button class="btn primary" id="ok">儲存</button>
    </div>
  `;
  $("dlg").showModal();
  $("cx").onclick = () => $("dlg").close();
  $("ok").onclick = () => {
    const name = $("c_n").value.trim() || "（未命名咖啡廳）";
    cb({
      rating: $("c_r").value.trim(),
      name,
      spot: $("c_s").value.trim(),
      desc: $("c_d").value.trim(),
      q: $("c_q").value.trim() || name
    });
    save();
    $("dlg").close();
    render();
  };
}

function dayForm(d, isNew) {
  $("dlgbody").innerHTML = `
    <h2 style="margin:0;font-size:22px;letter-spacing:-0.02em">${isNew ? "新增一天" : "編輯這一天"}</h2>
    <div class="row">
      <div><label>圖示</label><input id="g_e" value="${esc(d.emoji)}"></div>
      <div><label>日期</label><input id="g_d" value="${esc(d.date)}" placeholder="例：12/7（一）"></div>
    </div>
    <label>當日主題標題</label><input id="g_t" value="${esc(d.title)}">
    <div class="acts">
      ${isNew ? "" : `<button class="btn warn" id="gdel" style="margin-right:auto">刪除這天</button>`}
      <button class="btn" id="cx">取消</button>
      <button class="btn primary" id="ok">儲存</button>
    </div>
  `;
  $("dlg").showModal();
  $("cx").onclick = () => $("dlg").close();
  if (!isNew) {
    $("gdel").onclick = () => {
      if (confirm("確定刪除整天行程？")) {
        S.days = S.days.filter(x => x !== d);
        cur = "sum";
        save();
        $("dlg").close();
        render();
      }
    };
  }
  $("ok").onclick = () => {
    d.emoji = $("g_e").value || "📅";
    d.date = $("g_d").value;
    d.title = $("g_t").value || "新的一天";
    if (isNew) { S.days.push(d); cur = d.id; }
    save();
    $("dlg").close();
    render();
  };
}

$("toggleEdit").onclick = () => {
  toggleEditMode();
  render();
};

document.addEventListener("click", e => {
  const t = e.target.closest("[data-t]");
  if (t) {
    if (t.dataset.t === "+") dayForm({ id: uid(), date: "", title: "", emoji: "📅", items: [], cafes: [] }, true);
    else { cur = t.dataset.t; render(); scrollTo({ top: 0, behavior: "smooth" }); }
    return;
  }
  const g = e.target.closest("[data-go]");
  if (g) { cur = g.dataset.go; render(); scrollTo({ top: 0, behavior: "smooth" }); return; }

  const d = S.days.find(x => x.id === cur);
  if (e.target.id === "ed") return dayForm(d, false);
  if (e.target.id === "addi") return itemForm({ icon: "📌", time: "", title: "", notes: "", maps: [] }, v => d.items.push({ id: uid(), ...v }));
  if (e.target.id === "addc") return cafeForm({ rating: "4.8 ★", name: "", spot: "", desc: "", q: "" }, v => d.cafes.push({ id: uid(), ...v }));

  const a = e.target.closest("[data-a]");
  if (a && d) {
    const i = +a.closest(".card").dataset.i, it = d.items[i], k = a.dataset.a;
    if (k === "done") { S.done[it.id] = !S.done[it.id]; save(); render(); }
    else if (k === "edit") itemForm(it, v => Object.assign(it, v));
    else if (k === "del") { if (confirm("確定刪除「" + it.title + "」？")) { d.items.splice(i, 1); save(); render(); } }
    else {
      const j = k === "up" ? i - 1 : i + 1;
      if (j >= 0 && j < d.items.length) { [d.items[i], d.items[j]] = [d.items[j], d.items[i]]; save(); render(); }
    }
  }

  const ca = e.target.closest("[data-ca]");
  if (ca && d) {
    const ci = +ca.closest(".coffee-item").dataset.ci, c = d.cafes[ci], k = ca.dataset.ca;
    if (k === "edit") cafeForm(c, v => Object.assign(c, v));
    else if (k === "del") { if (confirm("確定刪除咖啡廳「" + c.name + "」？")) { d.cafes.splice(ci, 1); save(); render(); } }
  }

  if (e.target.id === "rst" && confirm("所有修改都會消失，確定恢復？")) {
    S = { days: JSON.parse(JSON.stringify(DEF)), done: {} };
    save();
    render();
  }
  if (e.target.id === "exp") {
    $("dlgbody").innerHTML = `<h2 style="margin:0;font-size:22px">備份行程</h2><p style="font-size:14px;color:var(--sub)">複製下方文字傳給家人，或貼到記事本保存。</p><textarea id="bx" style="min-height:180px" readonly>${esc(JSON.stringify(S))}</textarea><div class="acts"><button class="btn primary" id="cx">關閉</button></div>`;
    $("dlg").showModal();
    $("cx").onclick = () => $("dlg").close();
  }
  if (e.target.id === "imp") {
    $("dlgbody").innerHTML = `<h2 style="margin:0;font-size:22px">還原備份</h2><p style="font-size:14px;color:var(--sub)">貼上之前複製的備份文字。</p><textarea id="bx" style="min-height:180px"></textarea><div class="acts"><button class="btn" id="cx">取消</button><button class="btn primary" id="ok">還原</button></div>`;
    $("dlg").showModal();
    $("cx").onclick = () => $("dlg").close();
    $("ok").onclick = () => {
      try {
        const n = JSON.parse($("bx").value);
        if (!n.days) throw 0;
        n.days.forEach(x => { if (!Array.isArray(x.cafes)) x.cafes = []; });
        S = n;
        save();
        $("dlg").close();
        render();
      } catch (_) { alert("格式不正確，請確認是否完整複製"); }
    };
  }
});

$("editBanner").innerHTML = `<span>編輯模式已開啟</span><button id="bannerDone">完成</button>`;
$("bannerDone").onclick = () => { toggleEditMode(); render(); };
$("toggleEdit").innerHTML = "編輯模式";
render();
</script>
</body>
</html>
